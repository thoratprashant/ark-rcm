<div class="claims-page">
  <nav class="billing-tabs" aria-label="Charges and claims">
    <a routerLink="/billing-coordinator/charges" routerLinkActive="billing-tabs__link--active" class="billing-tabs__link">
      Charges
    </a>
    <a routerLink="/billing-coordinator/claims" routerLinkActive="billing-tabs__link--active" class="billing-tabs__link">
      Claims
    </a>
  </nav>

  <section class="billing-empty" aria-live="polite">
    <div class="billing-empty__icon" aria-hidden="true">
      <img src="assets/billing-coordinator/empty-clipboard.svg" alt="" width="24" height="24" />
    </div>
    <h2>No claims are ready yet</h2>
    <p>We'll notify you as soon as your first claim is available for review.</p>
    <button class="app-button app-button--primary billing-empty__button" type="button">
      <img src="assets/billing-coordinator/refresh-cw.svg" alt="" width="16" height="16" aria-hidden="true" />
      Refresh for New Claims
    </button>
  </section>
</div>
