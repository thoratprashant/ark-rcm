<form #setPasswordForm="ngForm" class="auth-card" (ngSubmit)="setPassword(setPasswordForm)" novalidate>
  <div class="auth-card__heading">
    <h2>Create Your Password</h2>
    <p>Please create a secure password for your new account.</p>
  </div>

  <div class="auth-card__fields">
    <label class="app-field" [class.app-field--error]="showFieldError(setPasswordForm, 'password')" for="password">
      <span class="app-field__label">New Password</span>
      <span class="app-control app-control--with-action">
        <input
          id="password"
          name="password"
          [type]="showPassword ? 'text' : 'password'"
          class="app-control__input"
          autocomplete="new-password"
          placeholder="Enter new password"
          required
          [ngModel]="password"
          (ngModelChange)="onPasswordChange($event)"
        />
        <button class="app-control__action" type="button" (click)="togglePassword()" aria-label="Toggle password visibility">
          <img [src]="showPassword ? 'assets/eye-grey.svg' : 'assets/eye-off-muted.svg'" alt="" width="16" height="16" />
        </button>
      </span>
      @if (showFieldError(setPasswordForm, 'password')) {
        <span class="app-field__message">Password is required.</span>
      }
    </label>

    <label
      class="app-field"
      [class.app-field--error]="showFieldError(setPasswordForm, 'confirmPassword') || showConfirmMismatch(setPasswordForm)"
      for="confirmPassword"
    >
      <span class="app-field__label">Confirm New Password</span>
      <span class="app-control app-control--with-action">
        <input
          id="confirmPassword"
          name="confirmPassword"
          [type]="showConfirmPassword ? 'text' : 'password'"
          class="app-control__input"
          autocomplete="new-password"
          placeholder="Confirm new password"
          required
          [(ngModel)]="confirmPassword"
        />
        <button
          class="app-control__action"
          type="button"
          (click)="toggleConfirmPassword()"
          aria-label="Toggle confirm password visibility"
        >
          <img [src]="showConfirmPassword ? 'assets/eye-grey.svg' : 'assets/eye-off-muted.svg'" alt="" width="16" height="16" />
        </button>
      </span>
      @if (showFieldError(setPasswordForm, 'confirmPassword')) {
        <span class="app-field__message">Confirm password is required.</span>
      } @else if (showConfirmMismatch(setPasswordForm)) {
        <span class="app-field__message">Passwords do not match.</span>
      }
    </label>
  </div>

  <section class="auth-rules" aria-label="Password rules">
    <p class="auth-rules__title">Password Rules</p>
    <ul class="auth-rules__list">
      @for (rule of passwordRules(); track rule.label) {
        <li class="auth-rules__item" [class.auth-rules__item--valid]="rule.valid">
          <span class="auth-rules__indicator" aria-hidden="true"></span>
          <span>{{ rule.label }}</span>
        </li>
      }
    </ul>
  </section>

  <button class="app-button app-button--primary" type="submit" [disabled]="!canSubmit()">Set Password</button>
</form>
