<form #forgotPasswordForm="ngForm" class="auth-card" (ngSubmit)="sendResetLink(forgotPasswordForm)" novalidate>
  <div class="auth-card__heading">
    <h2>Forgot Your Password</h2>
    <p>Enter your email address and we'll send you a reset link.</p>
  </div>

  <div class="auth-card__fields">
    <label class="app-field" [class.app-field--error]="showFieldError(forgotPasswordForm, 'email')" for="email">
      <span class="app-field__label">Email Address</span>
      <span class="app-control app-control--with-icon">
        <img
          class="app-control__icon"
          [src]="showFieldError(forgotPasswordForm, 'email') ? 'assets/auth/mail-error.svg' : 'assets/auth/mail-grey.svg'"
          alt=""
          width="16"
          height="16"
        />
        <input
          id="email"
          name="email"
          type="email"
          class="app-control__input"
          autocomplete="email"
          placeholder="Enter your email address"
          required
          email
          [(ngModel)]="email"
        />
      </span>
      @if (showFieldError(forgotPasswordForm, 'email')) {
        @if (forgotPasswordForm.controls['email'].errors?.['required']) {
          <span class="app-field__message">Email address is required.</span>
        } @else if (forgotPasswordForm.controls['email'].errors?.['email']) {
          <span class="app-field__message">Enter a valid email address.</span>
        }
      }
    </label>
  </div>

  <button class="app-button app-button--primary" type="submit" [disabled]="forgotPasswordForm.invalid">
    Send Reset Link
  </button>

  <a class="auth-card__link" routerLink="/auth/login" aria-label="Back to login">Back to Login</a>
</form>
